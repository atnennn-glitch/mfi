<!doctype html><html lang="uk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0d0f"><title>Мої фінанси</title><link rel="stylesheet" href="styles.css"></head><body>
<div class="app"><aside><div class="brand"><span>₴</span><b>Мої фінанси</b></div><nav id="nav"></nav><div class="privacy">🔒 Дані зберігаються лише у цьому браузері</div></aside>
<main><header><div><p id="eyebrow">ОГЛЯД</p><h1 id="title">Фінансова картина</h1></div><button class="primary" id="addBtn">＋ Додати запис</button></header><section id="content"></section></main></div>
<dialog id="entryDialog"><form method="dialog" id="entryForm"><div class="dialog-head"><div><p>НОВИЙ ЗАПИС</p><h2>Додати до фінансів</h2></div><button class="icon" value="cancel">×</button></div><label>Розділ<select id="type" required><option value="expense">Витрати</option><option value="crypto">Крипто</option><option value="capital">Капітал</option><option value="work">Робота капіталу</option><option value="savings">Заощадження</option></select></label><label id="categoryLabel">Категорія<select id="category"><option>Продукти</option><option>Таксі</option><option>Оренда житла</option><option>Дозвілля</option></select></label><div class="grid2"><label>Сума, ₴<input id="amount" type="number" min="0" step="0.01" required placeholder="0"></label><label>Дата<input id="date" type="date" required></label></div><label id="nameLabel">Назва / де знаходиться<input id="name" placeholder="Наприклад: BTC, Monobank, депозит"></label><label>Коментар<textarea id="note" rows="3" placeholder="Деталі запису"></textarea></label><button class="primary wide" value="default">Зберегти запис</button></form></dialog>
<dialog id="confirmDialog"><form method="dialog" class="confirm"><h2>Видалити запис?</h2><p>Цю дію неможливо скасувати.</p><div><button value="cancel">Скасувати</button><button value="confirm" class="danger">Видалити</button></div></form></dialog>
<script src="app.js"></script></body></html>
