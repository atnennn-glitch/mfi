<!doctype html><html lang="uk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0d0f"><title>Мої фінанси</title><link rel="stylesheet" href="styles.css"></head><body>
<div class="app"><aside><div class="brand"><span>₴</span><b>Мої фінанси</b></div><nav id="nav"></nav><div class="privacy">🔒 Дані зберігаються лише у цьому браузері</div></aside>
<main><header><div><p id="eyebrow">ОГЛЯД</p><h1 id="title">Фінансова картина</h1></div><button class="primary" id="addBtn">＋ Додати запис</button></header><div class="toolbar"><label>Період<input id="monthFilter" type="month"></label><button id="allTimeBtn" class="ghost">Весь час</button><span></span><button id="exportBtn" class="ghost">↓ Резервна копія</button><button id="importBtn" class="ghost">↑ Відновити</button><input id="importFile" type="file" accept="application/json" hidden></div><section id="content"></section></main></div>
<dialog id="entryDialog"><form method="dialog" id="entryForm"><div class="dialog-head"><div><p id="dialogEyebrow">НОВИЙ ЗАПИС</p><h2 id="dialogTitle">Додати до фінансів</h2></div><button class="icon" value="cancel" formnovalidate>×</button></div><input id="editId" type="hidden"><label>Розділ<select id="type" required><option value="expense">Витрати</option><option value="income">Надходження</option><option value="crypto">Крипто</option><option value="capital">Капітал</option><option value="work">Робота капіталу</option><option value="savings">Заощадження</option></select></label><label id="categoryLabel"><span id="categoryCaption">Категорія</span><select id="category"><option>Продукти</option><option>Таксі</option><option>Оренда житла</option><option>Дозвілля</option></select></label><div class="grid2"><label><span id="amountCaption">Сума, ₴</span><input id="amount" type="text" inputmode="decimal" autocomplete="off" required placeholder="0 або 1250,50"></label><label>Дата<input id="date" type="date" required></label></div><label id="nameLabel"><span id="nameCaption">Назва / де знаходиться</span><input id="name" placeholder="Наприклад: депозит"></label><label id="counterpartyLabel" hidden>Від кого<input id="counterparty" placeholder="Ім’я або компанія"></label><label id="purposeLabel" hidden>За що сплачено<input id="purpose" placeholder="Послуга, проєкт або товар"></label><label>Коментар<textarea id="note" rows="3" placeholder="Деталі запису"></textarea></label><button class="primary wide" value="default">Зберегти запис</button></form></dialog>
<dialog id="confirmDialog"><form method="dialog" class="confirm"><h2>Видалити запис?</h2><p>Цю дію неможливо скасувати.</p><div><button value="cancel">Скасувати</button><button value="confirm" class="danger">Видалити</button></div></form></dialog>
<link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="extra.css"><link rel="stylesheet" href="analytics.css"><link rel="stylesheet" href="fixes.css"><script src="app.js"></script></body></html>
